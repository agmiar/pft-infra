[global]
   workgroup = PFT
   server string = BKP-1
   security = user
   map to guest = never
   server min protocol = SMB2
   smb encrypt = desired
   disable netbios = yes
   smb ports = 445
   interfaces = 192.168.160.10/27
   bind interfaces only = yes
   log file = /var/log/samba/%m.log
   max log size = 1000
   dns proxy = no

[BKP]
   path = /srv/bkp
   browseable = yes
   read only = no
   create mask = 0660
   directory mask = 0770
   valid users = backup
